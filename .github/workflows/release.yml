# Checks every skill, in skills/ and in a plugin, against the specification and each zip the README offers,
# checks each plugin and runs its tests with Claude Code itself,
# and on main releases every linked skill whose version has no tag yet.
# tools/release.py says why it works the way it does.
name: Release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The whole history and the tags: a zip is stamped with the last commit
      # that touched its skill, and a release is due when its tag is missing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate against the Agent Skills specification
        run: |
          pip install skills-ref==0.1.1
          for skill in skills/*/ plugins/*/skills/*/; do agentskills validate "$skill"; done
      # The tests sit beside the skill, not in it: whatever is in it ships.
      - name: Test the session condenser
        run: python3 -m unittest discover -s evals/session-review
      - name: Test the events collector and page
        run: python3 -m unittest discover -s evals/rio-maior-events
      - name: Check the zips
        run: python3 tools/release.py check

  # Claude Code checks its own plugins: the manifest validator, and the test
  # runner for a mod, which stands in for the engine. Neither calls a model or
  # needs a login. The latest release on purpose: when Claude Code changes under
  # a mod (the API is early access), CI is where that shows first. A job of its
  # own, which release does not wait for: such a change turns this red without
  # holding back a skill's release.
  plugins:
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # The latest package's install scripts run here; they get no token.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code, latest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Validate the marketplace and each plugin
        run: |
          claude plugin validate --strict .
          for plugin in plugins/*/; do claude plugin validate --strict "$plugin"; done
      - name: Run each plugin's tests
        run: |
          for plugin in plugins/*/; do
            if find "$plugin" -name '*.test.ts' -o -name '*.test.tsx' | grep -q .; then
              claude plugin test "$plugin"
            fi
          done

  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes close together must not both find the same tag missing.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Release each skill whose version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release.py pending | while read -r skill tag; do
            zip=$(python3 tools/release.py build "$skill")
            python3 tools/release.py notes "$skill" > "dist/$skill-notes.md"
            gh release create "$tag" "$zip" \
              --target "$GITHUB_SHA" \
              --title "$skill ${tag#"$skill"-}" \
              --notes-file "dist/$skill-notes.md"
          done
